schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform
context: |
  Overview: This is a web application for a local basketball group/s that allows users to track 
  games and payments for games. The application will have a user-friendly interface 
  and will be accessible on both desktop and mobile devices.
  Tech stack: C# dotnet10, entity framework, Postgres SQL, Sveltekit 5, 
  TailwindCSS, Docker, GitHub Actions, GitVersion
  Use conventional Commints and open a new branch each time you start a new spec, 
  please commit after tasks so that we can keep a work log
  Practices: Use TDD and BDD for development, and follow SOLID principles for code design. 
  Vertical Slice architecture will be used for the backend, and a component-based architecture will be used for the 
  frontend.
  Testing: Both the front end and backend will have unit tests and integration tests. 
  We will use xUnitV3 for backend testing and Playwright for frontend testing.


