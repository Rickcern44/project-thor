apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project-thor-web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Rickcern44/project-thor.git
    targetRevision: main
    path: infrastructure/deploy/web
  destination:
    server: https://kubernetes.default.svc
    namespace: project-thor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
