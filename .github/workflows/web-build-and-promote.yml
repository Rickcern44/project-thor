name: Web Build & Promote

on:
  push:
    branches: [main]
    paths:
      - 'src/web/**'

permissions:
  contents: write
  packages: write

concurrency:
  group: deploy-manifest-commit

env:
  IMAGE: ghcr.io/rickcern44/project-thor-web

jobs:
  build-and-promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3
        with:
          useConfigFile: true

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: src/web
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.gitversion.outputs.semVer }}
            ${{ env.IMAGE }}:latest

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Set image tag in Kustomize base
        working-directory: infrastructure/deploy
        run: kustomize edit set image ${{ env.IMAGE }}:${{ steps.gitversion.outputs.semVer }}

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infrastructure/deploy/kustomization.yaml
          git commit -m "chore(deploy): promote web to ${{ steps.gitversion.outputs.semVer }}"

          attempt=0
          until git push origin HEAD:main; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 2 ]; then
              echo "Push failed after retry" >&2
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
          done
